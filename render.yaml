services:
  - type: web
    name: eduquiz-medici
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: eduquiz_medici
